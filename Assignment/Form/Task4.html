<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   
</head>
<body>
    <table width="90%" border="1px" align="center" >
        <tr>
            <td colspan="4"> <center><h4>Registration Form</h4></center></td>
        </tr>
        <tr>
            <td>Student Name</td>
            <td><input type="text" name="first Name" id="First Name" placeholder="First Name"></td>
            <td><input type="text" name="Middle Name" id="Middle Name" placeholder="Middle Name"></td>
            <td><input type="text" name="Last Name" id="Last Name" placeholder="Last Name"></td>
        </tr>
          <tr>
            <td>Father's Name</td>
            <td><input type="text" name="Father Name" id="Father Name" placeholder="Enter your father's Name"></td>
           <td>Mother's Name</td>
            <td><input type="text" name="Mother Name" id="Mother Name" placeholder="Enter your Mother's Name"></td>
        </tr>
        <tr>
            <td>Date of Birth</td>
            <td><input type="date"></td>
            <td>Gender</td>
            <td>
                <label for="gender">Male</label>
                <input type="radio" id="gender" name="gender">
                <label for="gender">Female</label>
                <input type="radio" id="gender" name="gender"></td>
        </tr>
        <tr>
             <td>Category</td>
            <td>
                <label for="caste">Gen</label>
                <input type="radio" id="caste" name="caste">
                <label for="caste">OBC</label>
                <input type="radio" id="caste" name="caste">
                <label for="caste">SC/ST</label>
                <input type="radio" id="caste" name="caste">
            </td>
            <td>Handicapped</td>
            <td>
                 <label for="handicaped">Yes</label>
                <input type="radio" id="handicaped" name="handicaped">
                 <label for="handicaped">NO</label>
                <input type="radio" id="handicaped" name="handicaped">
            </td>
        </tr>
    
             <td>Ex-Serviceman</td>
            <td>
                 <label for="serviceman">Yes</label>
                <input type="radio" id="serviceman" name="serviceman">
                 <label for="serviceman">NO</label>
                <input type="radio" id="serviceman" name="serviceman">
            </td>
        
         
             <td>EWS</td>
            <td>
                 <label for="ews">Yes</label>
                <input type="radio" id="ews" name="ews">
                 <label for="ews">NO</label>
                <input type="radio" id="ews" name="ews">
            </td>
        </tr>
        <tr>
             <td>Email ID</td>
            <td><input type="email" name="Father Name" id="Father Name" ></td>
             <td>Mobile No.</td>
            <td><input type="number" name="mobilenumber" id="mobilenumber" ></td>
        </tr>
        <tr>
            <td>State</td>
            <td>
                <select>
                    <option value="">Select any One</option>
                      <option value="Bihar">Bihar</option>
                        <option value="Asam">Aasam</option>
                          <option value="MP">MP</option>
                </select>
            </td>
            <td>City</td>
            <td>
                <select>
                    <option value="">Select any One</option>
                      <option value="Siwan">Siwan</option>
                        <option value="Chhapra">Chhapra</option>
                          <option value="Patna">Patna</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>Upload Photo</td>
            <td><button>Browse...</button>No file selected</td>
       
            <td>Upload Signature</td>
            <td><button>Browse...</button>No file selected</td>
        </tr>
        <tr>
            <td></td>
            <td colspan="3" align="center"><button>Submit</button></td>
        </tr>
    </table>
</body>
</html>
