<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

  </head>

  <body>
    <div class="border-black border ms-1 mt-4 text-center bg-body">
         <h1 class="text-warning">RICR Student Interaction Panel</h1>
    <button onclick="showWelcome()" class="btn btn-primary">Show Welcome Message</button>
     <button onclick="showReminder()" class="btn btn-secondary">Show Course Reminder</button>
      <p class="text-success">
        Note:-
        When a student clicks a button, its onclick attribute
        calls the  JavaScript function. The function
        then displays an alert message on the screen.
    </p>
    </div>
   
    <!--Script-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

    ></script>
   <script src="script.js"></script>
  </body>
</html>
