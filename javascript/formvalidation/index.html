<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <form id="loginForm" >
      <div>
        <label for="userName">User Name:</label>
        <input type="text" name="userName" id="userName" />
      </div>
      <div>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" />
      </div>
      <button type="submit">Sumbit</button>
    </form>
 <hr />
    <hr />
    <section>
      <form id="testform">
        <label for="fullName">Full Name :</label>
        <input
          type="text"
          name="fullName"
          id="fullName"
          placeholder="Your Name"
        />

        <br />
        <br />
        <label for="email">Email :</label>
        <input type="email" name="email" id="email" placeholder="Your email" />

        <br />
        <br />
        <label for="password">Password :</label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Your password"
        />
        <span class="error" id="passwordError"></span>

        <br />
        <br />
        <label for="cfpassword">Confirm Password :</label>
        <input
          type="password"
          name="cfpassword"
          id="cfpassword"
          placeholder="Confirm your password"
        />
        <span class="error" id="cfPasswordError"></span>

        <br />
        <br />
        <label for="dob">Date of Birth :</label>
        <input type="date" name="dob" id="dob" />

        <br />
        <br />
        <label for="tob">Time of Birth :</label>
        <input type="time" name="tob" id="tob" />

        <br />
        <br />
        <label for="joiningTime">Joining Time :</label>
        <input type="datetime-local" name="joiningTime" id="joiningTime" />

        <br /><br />
        <button type="submit">Submit test From</button>
      </form>
    </section>
    <!--Script-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
