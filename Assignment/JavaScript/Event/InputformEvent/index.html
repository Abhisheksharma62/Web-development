<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Question 1</h1>
    <h2 class="text-info">RICR Student Information</h2>
    <label for="studentName">Enter Student Name:</label>
    <input type="text" placeholder="Enter your name" id="studentName" />
    <p id="name">Your name will appear here.</p>

    <label for="courseName">Enter Course Name:</label>
    <input type="text" id="courseName" placeholder="Enter course name" />
    <p id="course">Your name will appear here.</p>
    <br /><br />
    <hr />
    <h1>Question 2.</h1>
    <h2 class="text-info">RICR Course Enrollment</h2>

    <form id="registration">
      <label for="studentName">Enter Student Name:</label>
      <input type="text"  required />
      <br /><br />
      <label for="courseName">Enter Course Name:</label>
      <input type="text" required />
      <br /><br />
      <button type="submit" class="btn btn-primary">Enroll Now</button>
    </form>
    <p id="message"></p>

    <!--Script-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
